{% extends "base.html" %}
{% block title %}Profile · Life Progress{% endblock %}
{% block content %}
<section class="hero small">
  <p class="eyebrow">Your timeline</p>
  <h1>{% if profile %}Profile settings{% else %}Start your Life Progress{% endif %}</h1>
  <p>Set the dates that drive your private dashboard. Your data stays on this server.</p>
</section>

<section class="panel form-panel">
<form method="post">
  <label>
    Your name
    <input name="name" required value="{{ profile.name if profile else '' }}" placeholder="Matt">
  </label>
  <label>
    Date of birth
    <input type="date" name="birth_date" required value="{{ profile.birth_date if profile else '' }}">
  </label>
  <label>
    Assumed lifespan
    <input type="number" name="lifespan" min="1" max="150" required value="{{ profile.lifespan if profile else 85 }}">
    <small>This is only a visualization target. Change it whenever you like.</small>
  </label>
  <button type="submit">Save profile</button>
</form>
</section>
{% endblock %}
